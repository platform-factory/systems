# svc-scratch — C-31's scratch tenant, and a temporary one (2026-10-27).
#
# C-31 (a): "a scratch tenant onboarded from one file with one database
# claim, then offboarded", on the engine's four custom roles after Apply B.
# This one file is the whole onboarding. Its service repo is
# platform-factory/svc-onboard, reused after that tenant's offboarding, with
# a one-database claims.yaml; checkout@thecloudgeek.io already exists.
#
# It is offboarded in the same session, and its registry, instance and
# service account deleted by a person (ADR-0015 §5, ADR-0019 §1).
apiVersion: platform.thecloudgeek.io/v1alpha1
kind: System
metadata:
  name: svc-scratch
spec:
  owner:
    team: checkout
    repo: platform-factory/svc-onboard
  tier: standard
  securityTier: internal
  size: S
