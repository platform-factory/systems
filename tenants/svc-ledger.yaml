# svc-ledger — the reference implementation's second tenant.
#
# One file in tenants/ is one System, and one System is one deployable unit
# with its own namespace (ADR-0012). Everything the tenant gets is composed
# from the five fields below; nothing here names a Kubernetes or GCP resource.
#
# This file was the C-05 test ("onboarding a tenant is one YAML file"). Moving
# it from docs/ into tenants/ WAS the test: commit dfdfd03 is a pure rename,
# zero bytes changed, merged as PR #2 at 17:02:13 UTC. The System reported
# Ready at 17:06:21 — merge → Ready 4m08s. Method and result: README.md,
# "Onboarding a tenant"; the grade (HELD) is in the design seed's build log,
# docs/build-log/m2-paved-road.md. The header this file carried while it was
# still prepared is in git: `git show dfdfd03^:docs/c05-second-tenant.yaml`.
#
# ------------------------------------------------------------------------
# Two prerequisites, both outside this repo — both settled before the run
# ------------------------------------------------------------------------
# 1. The Google Group checkout@thecloudgeek.io must exist and be nested under
#    gke-security-groups@thecloudgeek.io. Group creation is a Workspace-admin
#    task, deliberately outside the paved road in M2 (ADR-0012 §3). Without
#    it the RoleBinding applies and resolves to nobody. Whether the GCP IAM
#    members carrying the same group email (Artifact Registry writer, the two
#    Cloud SQL login grants) apply against a group that does not exist is
#    unverified [I] — if GCP rejects the principal, those managed resources
#    stay un-Ready and the System XR never reports Ready, which would have
#    stopped the clock. Settled before the run.
#
# 2. The repo github.com/platform-factory/svc-ledger must exist and contain a
#    k8s/ directory on main.
#
#    This does NOT hang the System XR, and the earlier draft of this file said
#    it did — corrected 2026-09-16. Two reasons. First, the System Composition
#    declares the composed Argo Application ready on existence
#    (gotemplating.fn.crossplane.io/ready: "True"), deliberately, so that a
#    platform object's readiness never depends on a tenant's git history.
#    Second, even a health-gated Composition would not hang: argo-cd v3.4.6
#    calls setApplicationHealth unconditionally (controller/state.go:985) and
#    an Application with zero managed resources returns Healthy, because
#    controller/health.go:25 starts at Healthy and the loop body never runs.
#    A missing path produces a ComparisonError condition and sync status
#    Unknown (controller/state.go:968, util/app/path/path.go:25) — never an
#    unhealthy Application.
#
#    The repo is a prerequisite for a different reason: ADR-0012 defines a
#    usable namespace as the System XR Ready AND a Deployment admitted under
#    the System's AppProject, and the second half needs something to sync. A
#    repo holding a single trivial Deployment is enough.
#
# ------------------------------------------------------------------------
# Why a DIFFERENT team from svc-hello
# ------------------------------------------------------------------------
# C-05 itself does not care — a second tenant is a second tenant. Using
# checkout rather than payments set up C-06 (move svc-hello between teams,
# run 2026-09-16 and re-run 2026-09-17) without a second round of
# Workspace-admin work, and it proved the group name really is derived from
# the field rather than hardcoded anywhere.
apiVersion: platform.thecloudgeek.io/v1alpha1
kind: System
metadata:
  # 10 characters, lowercase, leading letter: inside the 6-30 character GCP
  # service account ID limit that the System name has to satisfy.
  name: svc-ledger
spec:
  owner:
    team: checkout
    repo: platform-factory/svc-ledger
  tier: standard
  securityTier: internal
  size: S
